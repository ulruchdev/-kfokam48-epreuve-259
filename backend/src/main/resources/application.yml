spring:
  application:
    name: attendance
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:app_secret}
  jpa:
    hibernate:
      ddl-auto: validate        # B5: schema owned by Flyway only
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      accept-float-as-int: false   # RG8: 12.5 must be rejected, never truncated to 12

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: "Contrat figé (api/contrat.yaml)"
        url: /contrat.yaml
      - name: "Généré depuis le code"
        url: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
  error:
    include-stacktrace: never   # B4: a stack trace sent to the client is a fault
