openapi: 3.0.3
info:
  title: Contrat API — KFOKAM48 Épreuve (Attendance & Peer Review Tracker)
  version: "1.2"
  description: |
    Les cinq opérations imposées par le sujet existent EXACTEMENT ainsi :
    mêmes chemins, mêmes verbes, mêmes codes de statut, même format d'erreur.

    Politique d'extension (additive uniquement) :
    - des propriétés OPTIONNELLES peuvent s'ajouter aux corps requis (dureeMinutes, finAt) ;
    - de NOUVEAUX endpoints /api/* sont libres ;
    - de NOUVEAUX codes d'erreur peuvent s'ajouter ; aucun statut imposé n'est retiré ni renommé ;
    - DEC-9 (sémantique HTTP) : chaque erreur porte son vrai statut —
      400 entrée invalide · 403 action interdite à cet acteur · 404 ressource inconnue
      (chemin OU corps) · 405 méthode non autorisée · 409 conflit d'état · 410 code expiré ·
      415 corps non JSON · 429 trop de tentatives (RG3) · 500 imprévu uniquement ;
    - codes transverses : CORPS_INVALIDE (400), PARAMETRE_MANQUANT (400),
      PARAMETRE_INVALIDE (400), METHODE_NON_AUTORISEE (405), TYPE_NON_SUPPORTE (415) ;
    - le format d'erreur {"code", "message"} vaut pour TOUTES les erreurs, sans exception.

servers:
  - url: http://localhost:8080

paths:

  # ===================== OPÉRATIONS IMPOSÉES =====================

  /api/sessions:
    post:
      summary: "[IMPOSÉ] Le formateur ouvre une session et obtient un code de présence"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titre, promotionId]
              properties:
                titre: { type: string }
                promotionId: { type: integer, format: int64 }
                dureeMinutes:
                  type: integer
                  description: "Extension additive (DEC-2). Défaut 120. Définit finAt."
      responses:
        "201":
          description: Session ouverte
          content:
            application/json:
              schema:
                type: object
                required: [id, code, ouvertureAt, expirationAt]
                properties:
                  id: { type: integer, format: int64 }
                  code: { type: string }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
                  finAt:
                    type: string
                    format: date-time
                    description: "Extension additive (DEC-2) : fin de session prévue."
                  statut:
                    type: string
                    enum: [OUVERTE, TERMINEE, CLOTUREE]
                    description: "Extension additive."
        "400": { $ref: "#/components/responses/Erreur" }   # CHAMP_MANQUANT
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE (DEC-9)
    get:
      summary: "[LIBRE] Liste des sessions d'une promotion"
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Sessions de la promotion (toutes, la plus récente d'abord)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionResume"
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  /api/presences:
    post:
      summary: "[IMPOSÉ] Un étudiant marque sa présence avec le code"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, etudiantId]
              properties:
                code: { type: string }
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence enregistrée
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }   # CODE_INCONNU, CHAMP_MANQUANT
        "404": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_INCONNU (DEC-9)
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT
        "410": { $ref: "#/components/responses/Erreur" }   # CODE_EXPIRE
        "429": { $ref: "#/components/responses/Erreur" }   # TOO_MANY_ATTEMPTS (RG3 : 5 erreurs -> blocage 2 min, Q4)

  /api/exercices:
    post:
      summary: "[IMPOSÉ] Un étudiant dépose le lien de son exercice"
      description: |
        Extension additive (DEC-4/RG14) : l'étudiant doit avoir marqué sa présence à la
        session, sinon 400 PRESENCE_REQUISE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId, lien]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
                lien: { type: string, format: uri }
      responses:
        "201":
          description: Exercice déposé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string, enum: [EN_ATTENTE_AFFECTATION, EN_ATTENTE_RELECTURE, RELU] }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE, PRESENCE_REQUISE, CHAMP_MANQUANT
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE, ETUDIANT_INCONNU (DEC-9)
        "409": { $ref: "#/components/responses/Erreur" }   # EXERCICE_DEJA_DEPOSE, SESSION_CLOTUREE

  /api/relectures/{id}:
    post:
      summary: "[IMPOSÉ] Un relecteur rend sa note et son commentaire"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, commentaire]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200": { description: Relecture enregistrée }
        "400": { $ref: "#/components/responses/Erreur" }   # NOTE_INVALIDE
        "403": { $ref: "#/components/responses/Erreur" }   # AUTO_RELECTURE, RELECTURE_NON_ASSIGNEE
        "404": { $ref: "#/components/responses/Erreur" }   # RELECTURE_INCONNUE (DEC-9)
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEJA_RENDUE, SESSION_CLOTUREE
    put:
      summary: "[LIBRE] Le relecteur corrige sa relecture tant que la session n'est pas clôturée"
      description: "RG9 / DEC-1 (Q10 retenu contre Q15). Après clôture : 409 SESSION_CLOTUREE."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, commentaire]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200":
          description: Relecture corrigée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relecture"
        "400": { $ref: "#/components/responses/Erreur" }   # NOTE_INVALIDE
        "403": { $ref: "#/components/responses/Erreur" }   # RELECTURE_NON_ASSIGNEE
        "404": { $ref: "#/components/responses/Erreur" }   # RELECTURE_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_CLOTUREE

  /api/tableau:
    get:
      summary: "[IMPOSÉ] Le tableau récapitulatif du formateur"
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Récapitulatif par étudiant
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    [etudiantId, nom, presences, exercicesDeposes, moyenne, relecturesEnAttente]
                  properties:
                    etudiantId: { type: integer, format: int64 }
                    nom: { type: string }
                    presences: { type: integer }
                    exercicesDeposes: { type: integer }
                    moyenne: { type: number, nullable: true }
                    relecturesEnAttente: { type: integer }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  # ===================== ENDPOINTS LIBRES =====================

  /api/promotions:
    get:
      summary: "[LIBRE] Liste des promotions (choix d'identité, EF10 — Q1)"
      responses:
        "200":
          description: Promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nom]
                  properties:
                    id: { type: integer, format: int64 }
                    nom: { type: string }

  /api/promotions/{promotionId}/etudiants:
    get:
      summary: "[LIBRE] Étudiants d'une promotion (choix d'identité, EF10 — Q1)"
      parameters:
        - name: promotionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Étudiants de la promotion
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nom]
                  properties:
                    id: { type: integer, format: int64 }
                    nom: { type: string }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  /api/sessions/{id}:
    get:
      summary: "[LIBRE] Détail d'une session"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Détail de la session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
    put:
      summary: "[LIBRE] Le formateur ajuste l'heure de fin de la session (DEC-2)"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [finAt]
              properties:
                finAt: { type: string, format: date-time }
      responses:
        "200":
          description: Session mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "400": { $ref: "#/components/responses/Erreur" }   # FIN_AVANT_OUVERTURE
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_CLOTUREE

  /api/sessions/{id}/cloture:
    post:
      summary: "[LIBRE] Le formateur clôture la session (EF8)"
      description: "Après clôture : plus de dépôt (RG10), plus de correction de relecture (RG9)."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Session clôturée }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_DEJA_CLOTUREE

  /api/sessions/{id}/presences:
    post:
      summary: "[LIBRE] Le formateur ajoute une présence à la main (EF7 — Q14, RG12)"
      description: "La réponse renvoie source=FORMATEUR : « ajouté par le formateur » doit se voir."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [etudiantId]
              properties:
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence ajoutée
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }   # CHAMP_MANQUANT, ETUDIANT_HORS_PROMOTION
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE, ETUDIANT_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT, SESSION_CLOTUREE

  /api/sessions/{id}/exercices:
    get:
      summary: "[LIBRE] Exercices d'une session (vue formateur / affectation)"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Exercices de la session
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exercice"
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE

  /api/exercices/{id}:
    put:
      summary: "[LIBRE] L'étudiant remplace le lien de son exercice (EF12 — Q13, RG11)"
      description: "Impossible si une relecture a commencé : 409 RELECTURE_COMMENCEE."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lien]
              properties:
                lien: { type: string, format: uri }
      responses:
        "200":
          description: Lien remplacé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercice"
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "404": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_COMMENCEE, SESSION_CLOTUREE

  /api/relectures:
    get:
      summary: "[LIBRE] Relectures assignées à un relecteur (EF13)"
      parameters:
        - name: relecteurId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Relectures assignées (en attente et rendues)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelectureAssignee"
        "400": { $ref: "#/components/responses/Erreur" }   # PARAMETRE_MANQUANT
        "404": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_INCONNU

  /api/etudiants/{etudiantId}/exercices:
    get:
      summary: "[LIBRE] Exercices d'un étudiant avec les relectures reçues (EF9 — Q8, RG7)"
      description: "Le nom du relecteur n'est JAMAIS exposé (RG7)."
      parameters:
        - name: etudiantId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: sessionId
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Exercices et relectures reçues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExerciceAvecRelecture"
        "404": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_INCONNU

components:
  schemas:
    Erreur:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: "Identifiant stable, en majuscules. Exemple - CODE_EXPIRE"
        message:
          type: string
          description: "Phrase lisible par un humain, en français"
    SessionResume:
      type: object
      required: [id, titre, ouvertureAt, expirationAt, finAt, statut]
      properties:
        id: { type: integer, format: int64 }
        titre: { type: string }
        ouvertureAt: { type: string, format: date-time }
        expirationAt: { type: string, format: date-time }
        finAt: { type: string, format: date-time }
        statut: { type: string, enum: [OUVERTE, TERMINEE, CLOTUREE] }
    SessionDetail:
      allOf:
        - $ref: "#/components/schemas/SessionResume"
        - type: object
          required: [promotionId]
          properties:
            promotionId: { type: integer, format: int64 }
    Exercice:
      type: object
      required: [id, sessionId, etudiantId, etudiantNom, lien, statut]
      properties:
        id: { type: integer, format: int64 }
        sessionId: { type: integer, format: int64 }
        etudiantId: { type: integer, format: int64 }
        etudiantNom: { type: string }
        lien: { type: string, format: uri }
        statut: { type: string, enum: [EN_ATTENTE_AFFECTATION, EN_ATTENTE_RELECTURE, RELU] }
    ExerciceAvecRelecture:
      allOf:
        - $ref: "#/components/schemas/Exercice"
        - type: object
          properties:
            relecture:
              type: object
              nullable: true
              description: "Null si aucune relecture rendue. Jamais le nom du relecteur (RG7)."
              required: [note, commentaire]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
    Relecture:
      type: object
      required: [id, exerciceId, relecteurId, note, commentaire, rendue]
      properties:
        id: { type: integer, format: int64 }
        exerciceId: { type: integer, format: int64 }
        relecteurId: { type: integer, format: int64 }
        note: { type: integer, minimum: 0, maximum: 20, nullable: true }
        commentaire: { type: string, nullable: true }
        rendue: { type: boolean }
    RelectureAssignee:
      type: object
      required: [id, exerciceId, exerciceLien, auteurNom, rendue]
      properties:
        id: { type: integer, format: int64 }
        exerciceId: { type: integer, format: int64 }
        exerciceLien: { type: string, format: uri }
        auteurNom: { type: string }
        rendue: { type: boolean }
        note: { type: integer, nullable: true }
        commentaire: { type: string, nullable: true }

  responses:
    Erreur:
      description: |
        Format d'erreur imposé pour TOUTES les erreurs, sans exception.
        Une stack trace, un corps vide ou la page d'erreur par défaut de Spring
        valent zéro sur ce critère.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
          example:
            code: CODE_EXPIRE
            message: Le code de présence a expiré.
